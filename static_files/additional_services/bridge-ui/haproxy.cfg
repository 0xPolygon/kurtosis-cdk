# Global settings
global
    log stdout format raw local0
    tune.disable-zero-copy-forwarding
    maxconn 1024

# Default settings for all proxies
defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

# Frontend configuration
frontend http_in
    bind *:80

    # CORS settings
    http-response set-header Access-Control-Allow-Origin "*"
    http-response set-header Access-Control-Allow-Methods "GET, DELETE, OPTIONS, POST, PUT"

    # Define ACLs for URL matching
    acl url_l1rpc path_beg /l1rpc
{{- range .l2_rpc_backends }}
    acl url_l2rpc{{ .path_suffix }} path_beg /l2rpc{{ .path_suffix }}
{{- end }}
    # Bare /l2rpc route, aliased to chain 1. It is used after the per-chain
    # routes above so that /l2rpc-002 is not swallowed by this prefix match.
    acl url_l2rpc path_beg /l2rpc
{{- if .bridge_hub_api_url }}
    acl url_bridgehubapi path_beg /bridgehubapi
{{- end }}
{{- range .aggkit_backends }}
    acl url_aggkitapi{{ .path_suffix }} path_beg /aggkitapi{{ .path_suffix }}
{{- end }}

{{- if .aggkit_backends }}

    # Answer CORS preflights here instead of proxying them upstream.
    acl is_options method OPTIONS
    http-request return status 204 hdr "Access-Control-Allow-Origin" "*" hdr "Access-Control-Allow-Methods" "GET, DELETE, OPTIONS, POST, PUT" hdr "Access-Control-Allow-Headers" "*" if is_options
{{- end }}

    # Use backend based on ACL match
    use_backend backend_l1rpc if url_l1rpc
{{- range .l2_rpc_backends }}
    use_backend backend_l2rpc{{ .path_suffix }} if url_l2rpc{{ .path_suffix }}
{{- end }}
    use_backend backend_l2rpc if url_l2rpc
{{- if .bridge_hub_api_url }}
    use_backend backend_bridgehubapi if url_bridgehubapi
{{- end }}
{{- range .aggkit_backends }}
    use_backend backend_aggkitapi{{ .path_suffix }} if url_aggkitapi{{ .path_suffix }}
{{- end }}
    default_backend backend_default

# Backend configuration for /l1rpc
backend backend_l1rpc
    http-request set-path /
    server server1 {{.l1_rpc_url}}

{{- range .l2_rpc_backends }}

# Backend configuration for /l2rpc{{ .path_suffix }}
backend backend_l2rpc{{ .path_suffix }}
    http-request set-path /
    server l2rpc{{ .path_suffix }} {{ .url }}
{{- end }}

# Backend configuration for /l2rpc (alias of chain 1)
backend backend_l2rpc
    http-request set-path /
    server server2 {{.l2_rpc_url}}

{{- if .bridge_hub_api_url }}

# Backend configuration for /bridgehubapi
backend backend_bridgehubapi
    http-request set-path "%[path,regsub(^/bridgehubapi/,/)]"
    server server3 {{.bridge_hub_api_url}}
{{- end }}
{{- range .aggkit_backends }}

# Backend configuration for /aggkitapi{{ .path_suffix }}: the prefix is stripped
# so the upstream sees its own routes (e.g. /bridge/v1/sync-status).
backend backend_aggkitapi{{ .path_suffix }}
    http-request set-path "%[path,regsub(^/aggkitapi{{ .path_suffix }}/,/)]"
    server aggkit{{ .path_suffix }} {{ .url }}
{{- end }}

# Default backend configuration
backend backend_default
{{- if .agglayer_dev_ui_url }}
    server server4 {{.agglayer_dev_ui_url}}
{{- else }}
    http-request return status 404
{{- end }}
