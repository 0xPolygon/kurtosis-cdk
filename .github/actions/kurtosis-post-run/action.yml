name: kurtosis-post-run
description: Dump enclave and upload it as an artifact after deploying Kurtosis packages.

inputs:
  enclave_name:
    description: The name of the kurtosis enclave
    required: true
  args_filename:
    description: The name of the args file
    required: false

runs:
  using: composite
  steps:
    - name: Check if the enclave exists
      id: enclave-check
      shell: bash
      run: |
        if kurtosis enclave inspect ${{ inputs.enclave_name }}; then
          echo "ENCLAVE_EXISTS=true" >> "${GITHUB_OUTPUT}"
          echo "Enclave ${{ inputs.enclave_name }} exists."
        else
          echo "ENCLAVE_EXISTS=false" >> "${GITHUB_OUTPUT}"
          echo "Enclave ${{ inputs.enclave_name }} does not exist."
        fi

    - name: Dump enclave
      if: steps.enclave-check.outputs.ENCLAVE_EXISTS == 'true'
      shell: bash
      run: kurtosis enclave dump ${{ inputs.enclave_name }} ./dump

    - name: Generate archive name
      if: steps.enclave-check.outputs.ENCLAVE_EXISTS == 'true'
      id: archive-name
      shell: bash
      run: |
        archive_name="kurtosis_cdk_dump_${{ github.run_id }}"
        if [[ -z "${{ inputs.args_filename }}" ]]; then
          archive_name+="_without_args"
        else
          archive_name+="_with_args_${{ inputs.args_filename }}"
        fi
        echo "ARCHIVE_NAME=${archive_name}" >> "${GITHUB_OUTPUT}"
        echo "ARCHIVE_NAME=${archive_name}"

    - name: Upload enclave dump
      if: steps.enclave-check.outputs.ENCLAVE_EXISTS == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.archive-name.outputs.ARCHIVE_NAME }}
        path: ./dump

    - name: Check for stopped services
      if: steps.enclave-check.outputs.ENCLAVE_EXISTS == 'true'
      shell: bash
      run: |
        stopped_services="$(kurtosis enclave inspect "${{ inputs.enclave_name }}" | grep STOPPED | grep -v "bridge-spammer" || true)"
        if [[ -n "${stopped_services}" ]]; then
          echo "❌ It looks like there is at least one stopped service in the enclave... Something must have halted..."
          echo "${stopped_services}"
          echo

          kurtosis enclave inspect "${{ inputs.enclave_name }}" --full-uuids | grep STOPPED | grep -v "bridge-spammer" | awk '{print $2 "--" $1}' |
            while read -r container; do
              echo "Printing logs for ${container}"
              echo "::warning title=${container}::Service stopped"
              docker logs --tail 50 "${container}"
            done
        else
          echo "✅ All services are running."
        fi

    # Log lines excluded below are known to be benign:
    # - agglayer logs "Failed to extract database schema, assuming empty, error: IO error: No such
    #   file or directory" while probing the not yet created database on first boot.
    - name: Check for errors in service logs
      if: steps.enclave-check.outputs.ENCLAVE_EXISTS == 'true'
      shell: bash
      run: |
        max_lines=50
        max_line_length=500
        kurtosis enclave inspect "${{ inputs.enclave_name }}" --full-uuids | grep RUNNING | grep -v "Status:" | awk '{print $2 "--" $1}' |
          while read -r container; do
            # The rpc fuzzers log every fuzzed request with its (often huge) result and expected
            # failures, so their logs always match and can flood the job log for tens of minutes.
            if [[ "${container}" == *rpc-fuzzer* ]]; then
              echo "Skipping logs for ${container}"
              echo "------------------------------"
              echo
              continue
            fi
            echo "Checking logs for ${container}"
            matches="$(docker logs --since 10m "${container}" 2>&1 | grep -Ev "NoPeersSubscribedToTopic|Errors: \[\]|Failed to extract database schema, assuming empty, error: IO error: No such file or directory" | grep "error\|warn\|exception\|failed\|fatal\|ERRO\|FATA\|panic" | cut -c "1-${max_line_length}" || true)"
            if [[ -n "${matches}" ]]; then
              count="$(wc -l <<<"${matches}")"
              if [[ "${count}" -gt "${max_lines}" ]]; then
                echo "Showing the last ${max_lines} of ${count} matching lines (see the enclave dump for the rest)."
              fi
              tail -n "${max_lines}" <<<"${matches}"
              echo "❌ Errors found in container logs!"
              echo "::warning title=${container}::Errors found in container logs"
            else
              echo "✅ No errors found in logs."
            fi
            echo "------------------------------"
            echo
          done
