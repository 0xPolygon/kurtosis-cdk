name: kurtosis-pre-run
description: Prepare the environment for deploying Kurtosis packages.

inputs:
  kurtosis_version:
    description: The version of Kurtosis to install, empty for the one kurtosis-workflows is tested with
    required: false
    default: ""
  docker_username:
    description: The username for Docker Hub
    required: false
  docker_token:
    description: The token for Docker Hub
    required: false
  pull_images_from_gcr:
    description: Whether to pull images from GCR
    required: false
    default: "true"
  gcp_workload_identity_provider:
    description: >-
      Workload identity provider used to authenticate to Google Cloud when pulling images from GCR.
      Defaults to the shared github-wif provider when empty.
    required: false
    default: ""
  gcp_service_account:
    description: >-
      Service account impersonated through the workload identity provider when pulling images from
      GCR. Defaults to kurtosis-cdk-ci when empty.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Free up disk space
      shell: bash
      # Removes preinstalled toolchains (Android, .NET, Haskell) and GitHub's preloaded images, ~24 GB.
      # Must run before the package images are pre-pulled.
      run: |
        df -h /
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
        docker image prune --all --force > /dev/null
        df -h /

    # Install dependencies
    - name: Install kurtosis
      id: kurtosis
      uses: 0xPolygon/kurtosis-workflows/.github/actions/setup-kurtosis@f09a1aa74beca7ce49980e9a67291f97bdd4eb5d # v0.1.4
      with:
        kurtosis_version: ${{ inputs.kurtosis_version }}

    - name: Install jq
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y jq
        jq --version

    - name: Install yq
      shell: bash
      run: |
        pip3 install yq
        yq --version

    - name: Install foundry
      uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      with:
        version: v1.8.0
        cache: false

    # Login to registries
    - name: Login to docker registry
      if: ${{ inputs.docker_username && inputs.docker_token }}
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_token }}

    - name: Login to github container registry
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # Pull images from GCR if specified
    - name: Detect fork
      id: detect-fork
      shell: bash
      run: |
        # If running from a fork, fallback to public images.
        if [[ "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
          echo "pull_gcr=false" >> $GITHUB_OUTPUT
        else
          echo "pull_gcr=${{ inputs.pull_images_from_gcr }}" >> $GITHUB_OUTPUT
        fi

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      with:
        python-version: 3.13

    - name: Add registry prefix to image names
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      shell: bash
      run: |
        script_path=$(realpath "${{ github.action_path }}/../../scripts/add-registry-prefix.py")
        python3 "${script_path}" --registry-prefix "europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/virtual"

    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      with:
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider || 'projects/337907489413/locations/global/workloadIdentityPools/github-wif/providers/github' }}
        service_account: ${{ inputs.gcp_service_account || 'kurtosis-cdk-ci@prj-polygonlabs-devtools-dev.iam.gserviceaccount.com' }}

    - name: Configure Docker to use GCR
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      shell: bash
      run: gcloud auth configure-docker europe-west2-docker.pkg.dev

    # The Artifact Registry mirror intermittently 404s a layer blob of an entry built from a mutable
    # tag (e.g. virtual/haproxy:3.2-bookworm) even though the digest exists upstream on Docker Hub.
    # The mirror cannot be repaired from CI, so pull-images retries each pull a bounded number of times.
    - name: Pre pull package images from GCR
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      uses: 0xPolygon/kurtosis-workflows/.github/actions/pull-images@f09a1aa74beca7ce49980e9a67291f97bdd4eb5d # v0.1.4
      with:
        images_file: modified-images.txt

    - name: Pre pull kurtosis core images from GCR
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      uses: 0xPolygon/kurtosis-workflows/.github/actions/pull-images@f09a1aa74beca7ce49980e9a67291f97bdd4eb5d # v0.1.4
      with:
        registry_prefix: europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/virtual
        images: |
          kurtosistech/engine:${{ steps.kurtosis.outputs.version }}
          kurtosistech/core:${{ steps.kurtosis.outputs.version }}
          kurtosistech/files-artifacts-expander:${{ steps.kurtosis.outputs.version }}
          timberio/vector:0.45.0-debian
          traefik:v2.11.62
          alpine:3.17
          badouralix/curl-jq:latest
          protolambda/eth2-val-tools:latest
          ethpandaops/ethereum-genesis-generator:5.2.2
          mslipper/deployment-utils@sha256:4506b112e4261014329152b161997129e7ca577f39c85e59cfdfdcb47ab7b5cf

    - name: Display docker images
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      shell: bash
      run: docker images
