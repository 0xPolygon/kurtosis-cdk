name: kurtosis-pre-run
description: Prepare the environment for deploying Kurtosis packages.

inputs:
  kurtosis_version:
    description: The version of Kurtosis to install
    required: false
    # 1.15.2 stalls the aggkit L2 bridge syncer on the agglayer 0.6.0 sovereign/FEP stacks, so
    # L2->L1 bridge claims never become ready; 1.18.2+ syncs correctly. See test.yml for details.
    default: 1.22.2
  docker_username:
    description: The username for Docker Hub
    required: false
  docker_token:
    description: The token for Docker Hub
    required: false
  pull_images_from_gcr:
    description: Whether to pull images from GCR
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Free up disk space
      uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true

    # Install dependencies
    - name: Install kurtosis
      shell: bash
      run: |
        echo "deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
        sudo apt update
        sudo apt install -y kurtosis-cli=${{ inputs.kurtosis_version }}
        kurtosis analytics disable
        # Since 1.21 the engine starts otel + ClickHouse side containers on Docker, and every kurtosis
        # command re-checks them. CI checks logs with `docker logs` and vector still serves
        # `kurtosis service logs`, so opt out of the otel collector.
        printf '%s\n' 'config-version: 9' 'should-send-metrics: false' 'kurtosis-clusters:' \
          '  docker:' '    type: docker' '    backend-log-collector: vector' > "$(kurtosis config path)"
        kurtosis version

    - name: Install jq
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y jq
        jq --version

    - name: Install yq
      shell: bash
      run: |
        pip3 install yq
        yq --version

    - name: Install foundry
      uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      with:
        version: v1.8.0
        cache: false

    # Login to registries
    - name: Login to docker registry
      if: ${{ inputs.docker_username && inputs.docker_token }}
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ inputs.docker_username }}
        password: ${{ inputs.docker_token }}

    - name: Login to github container registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # Pull images from GCR if specified
    - name: Detect fork
      id: detect-fork
      shell: bash
      run: |
        # If running from a fork, fallback to public images.
        if [[ "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
          echo "pull_gcr=false" >> $GITHUB_OUTPUT
        else
          echo "pull_gcr=${{ inputs.pull_images_from_gcr }}" >> $GITHUB_OUTPUT
        fi

    - uses: actions/setup-python@v7
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      with:
        python-version: 3.13

    - name: Add registry prefix to image names
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      shell: bash
      run: |
        script_path=$(realpath "${{ github.action_path }}/../../scripts/add-registry-prefix.py")
        python3 "${script_path}" --registry-prefix "europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/virtual"

    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      with:
        workload_identity_provider: "projects/337907489413/locations/global/workloadIdentityPools/github-wif/providers/github"
        service_account: "kurtosis-cdk-ci@prj-polygonlabs-devtools-dev.iam.gserviceaccount.com"

    - name: Configure Docker to use GCR
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      shell: bash
      run: gcloud auth configure-docker europe-west2-docker.pkg.dev

    - name: Pre pull package images from GCR
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      shell: bash
      run: |
        # The Artifact Registry mirror intermittently 404s a layer blob of an entry built from a
        # mutable tag (e.g. virtual/haproxy:3.2-bookworm) even though the digest exists upstream on
        # Docker Hub, which fails the whole job. The mirror cannot be repaired from CI, so retry
        # each pull a bounded number of times; a transient failure then succeeds on a later attempt.
        pull_with_retry() {
          local image="$1" attempt
          for attempt in 1 2 3; do
            docker pull "${image}" && return 0
            echo "::warning::docker pull ${image} failed (attempt ${attempt}/3)"
            if ((attempt < 3)); then
              sleep 5
            fi
          done
          echo "::error::docker pull ${image} failed after 3 attempts"
          return 1
        }
        export -f pull_with_retry
        # -P 8 keeps the original parallelism; the wrapper exits non-zero once an image runs out of
        # attempts, so xargs still fails the step (123) instead of silently dropping that image.
        cat modified-images.txt | xargs -n 1 -P 8 bash -c 'pull_with_retry "$@"' _

    - name: Pre pull kurtosis core images from GCR
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      shell: bash
      run: |
        registry="europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/virtual"
        images=(
          "kurtosistech/engine:${{ inputs.kurtosis_version }}"
          "kurtosistech/core:${{ inputs.kurtosis_version }}"
          "kurtosistech/files-artifacts-expander:${{ inputs.kurtosis_version }}"
          "timberio/vector:0.45.0-debian"
          "traefik:2.10.6"
          "alpine:3.17"
          "badouralix/curl-jq:latest"
          "protolambda/eth2-val-tools:latest"
          "ethpandaops/ethereum-genesis-generator:5.2.2"
          "mslipper/deployment-utils@sha256:4506b112e4261014329152b161997129e7ca577f39c85e59cfdfdcb47ab7b5cf"
        )
        # Same transient Artifact Registry blob 404 as the package images step above; retry each
        # pull a bounded number of times before treating the image as genuinely unavailable.
        pull_with_retry() {
          local image="$1" attempt
          for attempt in 1 2 3; do
            docker pull "${image}" && return 0
            echo "::warning::docker pull ${image} failed (attempt ${attempt}/3)"
            if ((attempt < 3)); then
              sleep 5
            fi
          done
          echo "::error::docker pull ${image} failed after 3 attempts"
          return 1
        }
        # Pull in parallel as before, but wait on every pid explicitly: a bare `wait` returns 0 even
        # when a background pull failed, which would hide the failure.
        pids=()
        for image in "${images[@]}"; do
          (
            pull_with_retry "${registry}/${image}" || exit 1
            # Docker refuses to create a tag whose reference carries a digest, and a digest-pinned
            # image is already addressed by its digest downstream, so there is no alias to create.
            if [[ "${image}" != *@sha256:* ]]; then
              docker tag "${registry}/${image}" "${image}"
            fi
          ) &
          pids+=($!)
        done
        failed=0
        for pid in "${pids[@]}"; do
          wait "${pid}" || failed=1
        done
        if ((failed)); then
          echo "::error::One or more kurtosis core images could not be pulled"
          exit 1
        fi

    - name: Display docker images
      if: ${{ steps.detect-fork.outputs.pull_gcr == 'true' }}
      shell: bash
      run: docker images
