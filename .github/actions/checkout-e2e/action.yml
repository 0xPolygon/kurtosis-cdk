name: checkout-e2e
description: Check out the pinned agglayer/e2e ref, the single place to bump it.

inputs:
  path:
    description: Where to check out agglayer/e2e
    default: agglayer-e2e
  submodules:
    description: Whether to check out the forge libs under lib/
    default: 'false'

runs:
  using: composite
  steps:
    - name: Checkout agglayer-e2e
      uses: actions/checkout@v7
      with:
        repository: agglayer/e2e
        path: ${{ inputs.path }}
        submodules: ${{ inputs.submodules }}
        ref: edc92d219bb8138850f670fa7e91bf88f026ed01 # 2026-10-08, estimate L1 deposit gas on Amsterdam (agglayer/e2e#270)
