name: checkout-e2e
description: Check out the pinned agglayer/e2e ref, the single place to bump it.

inputs:
  path:
    description: Where to check out agglayer/e2e
    default: agglayer-e2e
  submodules:
    description: Whether to check out the forge libs under lib/
    default: 'false'

runs:
  using: composite
  steps:
    - name: Checkout agglayer-e2e
      uses: actions/checkout@v7
      with:
        repository: agglayer/e2e
        path: ${{ inputs.path }}
        submodules: ${{ inputs.submodules }}
        ref: ac2a4c9dbfa4dd1485dddd30b6d9eea5f0794ec3 # 2026-10-27, stop aggkit before waiting for the null certificate (agglayer/e2e#272)
