# S11b — the HyperPay flavour: the full HyperPay payment fabric settling as an
# AggchainPayments rollup against real agglayer + aggkit + a real L1.
#
# Every non-obvious value below cites the trap or ruling it comes from
# (`plans/S11b-kurtosis-bridge-flow.md` §2 in the hyperpay repo). Nothing here
# is a guess, and nothing here configures HyperPay itself: HyperPay's own
# config is generated by `hp-stack materialize` and mounted verbatim
# (ADR-010).
deployment_stages:
  # aggkit's bridge service + the zkevm-bridge-service. The round-trip needs
  # the bridge REST API (`/bridge/v1/{bridges,claims,claim-proof,
  # l1-info-tree-index}`) to build claim proofs.
  deploy_cdk_bridge_infra: true

args:
  # The fixed pair, checked in both directions by input_parser's sanity check:
  # AggchainPayments is the only contract HyperPay's aggregator produces
  # aggchain_params for, and HyperPay is the only L2 that serves that flow.
  consensus_contract_type: payments
  sequencer_type: hyperpay

  # ---------------------------------------------------------------------------
  # Images. BOTH are local builds with no registry to pull from, produced by
  # `make e2e-images` in the hyperpay repo.
  #
  # ORDERING TRAP (T1 finding, mvp/results/s11b-environment.md §6):
  # `kurtosis clean -a` prunes unused local images. Build/verify these AFTER a
  # clean, never before, or the bring-up dies on "image not found".
  # ---------------------------------------------------------------------------
  # Release binaries + the harness presets and topology profiles
  # (e2e/docker/Dockerfile).
  hyperpay_node_image: hyperpay-node:local
  # agglayer-contracts v12.2.3 (== git 110bda5a) + the vendored 2-commit
  # AggchainPayments patch. AggchainPayments is ABSENT from the published
  # v12.2.3 image (verified: `grep -rl AggchainPayments /opt | wc -l` -> 0), so
  # the stock image cannot deploy this rollup type.
  agglayer_contracts_image: agglayer-contracts:hyperpay-local

  # ---------------------------------------------------------------------------
  # aggkit / agglayer pins. These OVERRIDE origin/main's defaults
  # (aggkit 0.10.0-rc7, agglayer 0.6.0-rc.5) with the versions
  # `docs/DEPENDENCIES.md` in the hyperpay repo pins.
  #
  # HONEST STATUS: the combination of these two pins against THIS fork's
  # templates is UNVALIDATED until T5 actually runs it. T1's bring-up used
  # origin/main's newer defaults, so a template incompatibility with the older
  # pins would first appear at T5, not here (a dry-run renders templates but
  # does not run aggkit).
  # ---------------------------------------------------------------------------
  aggkit_image: ghcr.io/agglayer/aggkit:0.9.0-rc3
  agglayer_image: ghcr.io/agglayer/agglayer:0.5.1
  # aggsender settles certificates; aggoracle injects L1 GERs into the bridge
  # shard's GER facade. No `autoclaim`: it does not exist in any reachable
  # aggkit build (absent from the pinned image, absent from the local v0.10
  # binary, and the precedent's source branch was deleted upstream), so the
  # round-trip uses a stock claim submitter (`polycli ulxly claim asset`).
  # No `bridge`-only split, and no aggkit-prover: the HyperPay aggregator
  # serves AggchainProofService itself.
  aggkit_components: aggsender,aggoracle

  # No aggsender-validator for this flavour (the precedent's choice, unchanged).
  use_agg_sender_validator: false
  agg_sender_multisig_threshold: 1
  agg_sender_validator_total_number: 0

  # ---------------------------------------------------------------------------
  # Proving. S11b is explicitly mock-proof (§1.8): agglayer's mock verifier is
  # what makes settlement testable at all here, and this host cannot prove
  # (glibc 2.31). Real proofs are S12.
  # ---------------------------------------------------------------------------
  agglayer_prover_primary_prover: mock-prover
  zkevm_use_real_verifier: false
  sp1_prover_key: ""

  # Native ETH only for the round trip; no custom gas token.
  gas_token_enabled: false

  # ---------------------------------------------------------------------------
  # HyperPay topology. The profile is the single knob: it names a file in the
  # hyperpay repo (`hyperpay-e2e/topologies/<profile>.toml`) that
  # `hp-stack materialize` turns into every service's config.
  #
  # `settlement` (S11b step B) is the full topology: 2 payment shards, 2
  # gateways, a shard prover per shard, the bridge shard and the aggregator.
  # The two lines below MOVE TOGETHER — `hyperpay_settlement` decides which
  # services are added, and the profile decides which configs exist for them
  # to load. `settlement` + `false` would generate config nothing uses;
  # `payments` + `true` would add three services with no config at all.
  #
  # The bridge shard's block-production loop is WIRED (hyperpay @ 670434c):
  # `eth_blockNumber` advances one heartbeat block per `epoch_length_secs` even
  # when idle, and submitted `insertGlobalExitRoot`/`claimAsset` mine.
  #
  # WHAT STILL GATES A FOLD, and it is a property of the design rather than a
  # bug: `hyperpay_agg_program::run` requires EXACT shard coverage — every shard
  # in the genesis topology must contribute at least one SBP to the epoch
  # (`children_by_shard.len() != topology_by_shard.len()` -> `ShardCoverage`).
  # Payment shards only produce SBPs when their sequencers seal blocks, and they
  # seal on traffic. So an IDLE stack cannot settle, by construction: aggsender
  # logs `epoch close failed: Rejected(ShardCoverage)` until BOTH payment shards
  # have traffic inside the epoch window. That is what T8's paced payment phase
  # provides, and it is why §1.9's pacing parameters are load-bearing.
  # ---------------------------------------------------------------------------
  hyperpay_stack_profile: settlement
  hyperpay_shard_count: 2
  hyperpay_gateway_count: 2
  hyperpay_settlement: true

  # ---------------------------------------------------------------------------
  # Trap T-d (PP value conservation). agglayer's pessimistic proof credits a
  # network's local balance tree ONLY from claimed imported bridge exits, never
  # from genesis balances — so bridging OUT value that never entered by a
  # claimed deposit underflows the LBT and wedges the chain in `InError`
  # PERMANENTLY. The spammer therefore deposits only; the withdrawal half of
  # the round trip is driven by T8's script, which claims first and caps the
  # withdrawal at the really-claimed amount.
  # ---------------------------------------------------------------------------
  bridge_spammer_l2_to_l1: false

  additional_services:
    - agglogger
    # `test_runner` (ghcr.io/agglayer/e2e:dda31ee) is the toolbox container
    # carrying cast/forge/polycli/jq: trap T-k says claim tooling runs INSIDE
    # the enclave against in-network DNS, not from the host.
    - test_runner
    - agglayer_dashboard
