# AggchainQBFT (AGGCHAIN_TYPE 0x0002): a 4-validator Besu QBFT chain whose certificates carry an
# aggchain proof of the QBFT seals, generated by aggkit-prover-qbft (agglayer/prover-besu-qbft).
#
# aggkit-prover-qbft has no published image yet, and AggchainQBFT support lives on feature branches
# of agglayer-contracts (contract + rollup tooling), aggkit (aggsender) and agglayer (aggchain type
# selector). Build those images locally and point the *_image args below at them.
args:
  sequencer_type: besu
  consensus_contract_type: qbft

  # 4 validators (mnemonic indices 100..103) plus a non-validator RPC node (index 104) that aggkit,
  # the bridge service and aggkit-prover-qbft talk to. A short epoch so validator votes take
  # effect quickly.
  besu_validator_count: 4
  besu_epoch_length: 20
  besu_block_period_seconds: 1

  # Mock prover: aggkit-prover-qbft executes the real QBFT program without proving it, and the
  # agglayer runs with the mock verifier. The real vkey is registered under 0x00010002.
  aggkit_prover_primary_prover: mock-prover
  agglayer_prover_primary_prover: mock-prover
  aggkit_prover_qbft_max_headers_per_proof: 7200

  # Images built from the AggchainQBFT branches.
  aggkit_prover_qbft_image: local/aggkit-prover-qbft:qbft-dev
  aggkit_image: local/aggkit:qbft-dev
  agglayer_image: local/agglayer:qbft-dev
  agglayer_contracts_image: local/agglayer-contracts:qbft-dev

  additional_services:
    - test_runner
