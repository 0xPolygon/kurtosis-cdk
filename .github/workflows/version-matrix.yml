name: version-matrix

on:
  schedule:
    - cron: 0 4 * * 1 # Monday 04:00 UTC, i.e. 6 AM Paris in summer (5 AM in winter), so bump PRs land before the workday.
  workflow_dispatch:
    inputs:
      notify:
        description: Post the outcome to Slack (always done on schedule).
        type: boolean
        default: false

permissions: {}

jobs:
  version-matrix:
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/version-matrix.yml@f8ed58e0fe06fa745ed8c9a81c06bb786924bfa8 # v0.1.6
    with:
      label: Kurtosis CDK version matrix
      notify: ${{ github.event_name == 'schedule' || inputs.notify }}
      slack_channel_id: C04DS0SG599
      check_timeout_minutes: 5
      kurtosis_version: 1.23.0
      kurtosis_test_version: v0.0.11
    secrets:
      claude_api_key: ${{ secrets.CLAUDE_API_KEY }}
      app_id: ${{ secrets.SEMANTIC_RELEASE_BOT_APP_ID }}
      app_private_key: ${{ secrets.SEMANTIC_RELEASE_BOT_APP_PRIVATE_KEY }}
      slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
