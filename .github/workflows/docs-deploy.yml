name: docs-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: 0xPolygon/kurtosis-workflows/.github/workflows/docs.yml@1d7acffacfb81187c58553013051b05304838b81
    with:
      node_version: 24.22.1
      deploy: true
      build_timeout_minutes: 5
      deploy_timeout_minutes: 10
