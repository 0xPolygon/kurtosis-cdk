name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  ENCLAVE_NAME: cdk
  # 1.15.2 stalls the aggkit L2 bridge syncer on the agglayer 0.6.0 sovereign/FEP stacks (the
  # syncer freezes at ~block 120 while the L2 chain keeps advancing), so the aggsender never
  # certifies the L2->L1 deposit and the bridge claim never becomes ready. 1.18.2 syncs correctly.
  KURTOSIS_VERSION: 1.18.2
  # leovct/kurtosis-test is a maintained fork of ethereum-optimism/kurtosis-test (upstream's
  # last release, v0.0.6, is from 2025-09 and pins kurtosis at 2025-08). v0.0.9 is built against
  # kurtosis 1.20.0 and ships prebuilt binaries, so we install the release archive instead of
  # compiling from source.
  KURTOSIS_TEST_VERSION: v0.0.9

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Install linters
      - name: Install kurtosis
        shell: bash
        run: |
          echo "deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt update
          sudo apt install -y kurtosis-cli=${{ env.KURTOSIS_VERSION }}
          kurtosis analytics disable

      - name: Install yamllint
        run: pip install yamllint

      - name: Install hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Install shellcheck
        run: sudo apt install shellcheck

      # Run linters
      - name: Run kurtosis linter
        run: kurtosis lint .

      - name: Run yamllint
        run: yamllint --config-file ${{ github.workspace }}/.github/scripts/.yamllint.yml .

      - name: Run hadolint
        run: find . -type f -name '*.Dockerfile' | sort | xargs -I {} hadolint --config ${{ github.workspace }}/.github/scripts/.hadolint.yml {}

      - name: Run shellcheck
        run: find . -type f -name '*.sh' | grep -v "./docs" | grep -v "/upgrade_forkid.sh" | sort | xargs -I {} shellcheck -x {}

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Verify external package pins
        run: python3 scripts/version-matrix/verify-package-pins.py

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@392b78fe18a52790c53f42456e46124f77346842 # v1.34.0
        with:
          config: ${{ github.workspace }}/.github/scripts/typos.toml

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2.7.0
        with:
          args: >
            --root-dir "$(pwd)"
            --verbose
            --no-progress
            --exclude-loopback
            --accept '100..=103,200..=299,429'
            --exclude-path .kurtosis-test/
            --exclude-path docs/node_modules/
            --exclude file://
            --exclude https://github.com/0xPolygon/kurtosis-cdk
            --exclude https://github.com/0xPolygon/arpeggio
            --exclude https://www.blockscout.com/
            --exclude https://unix.stackexchange.com/questions/65475/ephemeral-port-what-is-it-and-what-does-it-do
            --exclude http://anvil-001:8545
            --exclude ws://anvil-001:8545
            './**/*.md'
          fail: true

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install kurtosis-test
        run: |
          curl -sSfL "https://github.com/leovct/kurtosis-test/releases/download/${KURTOSIS_TEST_VERSION}/kurtosis-test_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kurtosis-test

      - name: Run unit tests
        run: kurtosis-test .

  # Deliberately NOT part of `unit`, and deliberately gated on nothing: every
  # integration job below is `needs: [lint, unit]`, so a failure (or a Go
  # toolchain download blip) in either of these two checks would SKIP the whole
  # matrix rather than fail it -- and GitHub reports a skipped required check as
  # satisfied. Keeping them in their own ungated job means they can go red on
  # their own without silently disabling integration coverage.
  snapshot-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run ports.sh shell unit tests
        run: ./snapshot/scripts/lib/ports_test.sh

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: scripts/anvil-template-check/go.mod

      - name: Check anvil-L2 template rendering (regression net for silent template fallbacks)
        run: ./scripts/anvil-template-check/check.sh

  run-without-args:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pre kurtosis run
        uses: ./.github/actions/kurtosis-pre-run
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_token: ${{ secrets.DOCKER_TOKEN }}

      - name: Kurtosis run
        run: kurtosis run --enclave=${{ env.ENCLAVE_NAME }} .

      - name: Inspect enclave
        run: kurtosis enclave inspect ${{ env.ENCLAVE_NAME }}

      - name: Monitor rollup progress
        working-directory: .github/scripts
        run: ./monitor.sh ${{ env.ENCLAVE_NAME }}

      - name: Run bridge tests
        uses: ./.github/actions/bridge-tests
        with:
          enclave_name: ${{ env.ENCLAVE_NAME }}

      - name: Post kurtosis run
        if: always()
        uses: ./.github/actions/kurtosis-post-run
        with:
          enclave_name: ${{ env.ENCLAVE_NAME }}

  list-ymls:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          file_paths=$(ls -R ./.github/tests/cdk-erigon/*.yml ./.github/tests/op-reth/*.yml ./.github/tests/other/anvil/anvil-rollup.yml)
          echo "file_paths:"
          echo "${file_paths}"
          echo

          matrix=$(echo "${file_paths}" | while read -r file_path; do
            file_name=$(basename -s ".yml" "${file_path}")
            folder_name=$(basename $(dirname "${file_path}"))
            if [[ "${folder_name}" == "cdk-erigon" ]] || [[ "${folder_name}" == "op-reth" ]]; then
              job_name="${folder_name}-${file_name}"
            elif [[ "${folder_name}" == "anvil" ]]; then
              # file_name is already "anvil-rollup" -- prefixing with the
              # folder name too would produce the redundant
              # "anvil-anvil-rollup", so this arm is explicit but keeps the
              # bare file_name as the job name.
              job_name="${file_name}"
            else
              job_name="${file_name}"
            fi
            echo "{\"name\": \"$job_name\", \"path\": \"$file_path\"}"
          done | jq -s -c '.')
          echo "matrix=${matrix}" >> $GITHUB_OUTPUT
          echo "matrix:"
          echo "${matrix}" | jq

  run-with-args:
    needs: [lint, unit, list-ymls]
    name: run-with-${{ matrix.file.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.list-ymls.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre kurtosis run
        uses: ./.github/actions/kurtosis-pre-run
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_token: ${{ secrets.DOCKER_TOKEN }}

      - name: Kurtosis run
        run: kurtosis run --enclave=${{ env.ENCLAVE_NAME }} --args-file=${{ matrix.file.path }} .

      - name: Inspect enclave
        run: kurtosis enclave inspect ${{ env.ENCLAVE_NAME }}

      - name: Monitor rollup progress
        run: |
          sequencer_type=$(yq --raw-output '.args.sequencer_type' ${{ matrix.file.path }})
          consensus_contract_type=$(yq --raw-output '.args.consensus_contract_type' ${{ matrix.file.path }})
          ./.github/scripts/monitor.sh ${{ env.ENCLAVE_NAME }} "$sequencer_type" "$consensus_contract_type"

      - name: Run bridge tests
        uses: ./.github/actions/bridge-tests
        with:
          enclave_name: ${{ env.ENCLAVE_NAME }}

      - name: Post kurtosis run
        if: always()
        uses: ./.github/actions/kurtosis-post-run
        with:
          enclave_name: ${{ env.ENCLAVE_NAME }}
          args_filename: ${{ matrix.file.name }}

  run-with-op-succinct:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    # FEP settlement is slow/resource-bound; the L2->L1 bridge claim waits up to 60m (on top of the
    # optimistic-mode cert wait), so give the job headroom over deploy + monitor + both bats suites.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Pre kurtosis run
        uses: ./.github/actions/kurtosis-pre-run
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_token: ${{ secrets.DOCKER_TOKEN }}

      - name: Kurtosis run
        run: kurtosis run --enclave=${{ env.ENCLAVE_NAME }} --args-file=./.github/tests/op-succinct/mock-prover.yml .

      - name: Inspect enclave
        run: kurtosis enclave inspect ${{ env.ENCLAVE_NAME }}

      - name: Monitor rollup progress
        working-directory: .github/scripts
        run: ./monitor.sh ${{ env.ENCLAVE_NAME }} op-reth fep

      - name: Install bats
        uses: bats-core/bats-action@42fcc8700f773c075a16a90eb11674c0318ad507 # 3.0.1
        with:
          support-path: "${{ github.workspace }}/lib/bats-support"
          assert-path: "${{ github.workspace }}/lib/bats-assert"
          detik-path: "${{ github.workspace }}/lib/bats-detik"
          file-path: "${{ github.workspace }}/lib/bats-file"

      - name: Install polycli
        run: |
          polycli_version="v0.1.87"
          pushd $(mktemp -d) || exit 1
          curl -s -L "https://github.com/0xPolygon/polygon-cli/releases/download/${polycli_version}/polycli_${polycli_version}_linux_amd64.tar.gz" > polycli.tar.gz
          tar xf polycli.tar.gz
          mv polycli_* /usr/local/bin/polycli
          polycli version

      - name: Checkout agglayer-e2e
        uses: actions/checkout@v4
        with:
          repository: agglayer/e2e
          path: agglayer-e2e
          ref: 3fb8af01358583e8c6df167beac9c1d2b06961c1 # 2026-03-05

      - name: Run bridge tests and op optimistic mode tests
        run: |
          set -eo pipefail
          pushd agglayer-e2e || exit 1

          set -a
          source ./tests/.env
          set +a

          export BATS_LIB_PATH="$PWD/core/helpers/lib"
          export PROJECT_ROOT="$PWD"
          export ENCLAVE_NAME="${{ env.ENCLAVE_NAME }}"
          # FEP settlement is slow on a contended runner; give the claim a generous wall-clock wait.
          export CLAIM_WAIT_DURATION="60m"

          # Run op optimistic mode tests
          bats ./tests/op/optimistic-mode.bats || exit 1

          # Run bridge tests.
          # NOTE: unlike the other jobs we deliberately keep the bridge-spammer running here.
          # op-succinct (FEP) L2->L1 claims need L1 GlobalExitRoot activity to keep flowing during
          # the claim wait: the proposer can only aggregate range proofs up to the L2 safe head
          # derived from the aggsender's finalized L1-info-tree leaf, and that leaf only advances
          # while the GER keeps being updated on L1. Stopping the spammer freezes that safe-head
          # cap between two range-proof boundaries, so the aggchain proof can never cover the
          # withdrawal block and the claim times out ("No range proofs found for the requested
          # range" -> "the deposit seems to be stuck").
          bats --filter 'bridge native ETH from L1 to L2' ./tests/agglayer/bridges.bats || exit 1
          bats --filter 'bridge native ETH from L2 to L1' ./tests/agglayer/bridges.bats || exit 1

      - name: Post kurtosis run
        if: always()
        uses: ./.github/actions/kurtosis-post-run
        with:
          enclave_name: ${{ env.ENCLAVE_NAME }}
          args_filename: cdk-op-reth-succinct

  run-with-additional-services:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pre kurtosis run
        uses: ./.github/actions/kurtosis-pre-run
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_token: ${{ secrets.DOCKER_TOKEN }}

      - name: Kurtosis run
        run: kurtosis run --enclave=${{ env.ENCLAVE_NAME }} --args-file=./.github/tests/additional-services.yml .

      - name: Inspect enclave
        run: kurtosis enclave inspect ${{ env.ENCLAVE_NAME }}

      - name: Verify arpeggio rpc
        run: |
          result=$(yq '.args.additional_services | contains(["arpeggio"])' ./.github/tests/additional-services.yml)
          if [ "$result" = "true" ]; then
            cast bn --rpc-url $(kurtosis port print ${{ env.ENCLAVE_NAME }} arpeggio-001 rpc)
          else
            echo "Arpeggio is not deployed."
          fi

      - name: Verify blutgang rpc
        run: |
          result=$(yq '.args.additional_services | contains(["blutgang"])' ./.github/tests/additional-services.yml)
          if [ "$result" = "true" ]; then
            cast bn --rpc-url $(kurtosis port print ${{ env.ENCLAVE_NAME }} blutgang-001 http)
          else
            echo "Blutgang is not deployed."
          fi

      - name: Verify erpc rpc
        run: |
          result=$(yq '.args.additional_services | contains(["erpc"])' ./.github/tests/additional-services.yml)
          if [ "$result" = "true" ]; then
            cast bn --rpc-url "$(kurtosis port print ${{ env.ENCLAVE_NAME }} erpc-001 rpc)/main/evm/2151908"
          else
            echo "ERPC is not deployed."
          fi

      - name: Verify that prometheus collects panoptichain metrics
        run: |
          result=$(yq '.args.additional_services | contains(["prometheus_grafana"])' ./.github/tests/additional-services.yml)
          if [ "$result" = "true" ]; then
            echo "Wait for one minute while Prometheus gathers metrics..."
            sleep 60

            echo "Retrieve Panoptichain metrics from Prometheus..."
            panoptichain_metric="panoptichain_system_uptime"
            prometheus_url=$(kurtosis port print ${{ env.ENCLAVE_NAME }} prometheus-001 http)
            prometheus_query=$(curl "$prometheus_url/api/v1/query?query=$panoptichain_metric")
            echo $prometheus_query | jq
            if [ "$(jq -r '.data.result[0].metric.__name__' <<<$prometheus_query)" == "$panoptichain_metric" ]; then
              echo "✅ Prometheus collects panoptichain metrics!"
            else
              echo "❌ Prometheus does not collect panoptichain metrics..."
              exit 1
            fi
          else
            echo "Prometheus is not deployed."
          fi

      - name: Post kurtosis run
        if: always()
        uses: ./.github/actions/kurtosis-post-run
        with:
          enclave_name: ${{ env.ENCLAVE_NAME }}
          args_filename: additional-services

  run-with-external-l1:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Pre kurtosis run
        uses: ./.github/actions/kurtosis-pre-run
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_token: ${{ secrets.DOCKER_TOKEN }}

      - name: Deploy local L1 chain
        run: kurtosis run --enclave=${{ env.ENCLAVE_NAME }} --args-file=./.github/tests/external-l1/deploy-local-l1.yml .

      - name: Deploy to local L1 chain
        run: kurtosis run --enclave=${{ env.ENCLAVE_NAME }} --args-file=./.github/tests/external-l1/deploy-cdk-to-local-l1.yml .

      - name: Inspect enclave
        run: kurtosis enclave inspect ${{ env.ENCLAVE_NAME }}

      - name: Monitor rollup progress
        working-directory: .github/scripts
        run: ./monitor.sh ${{ env.ENCLAVE_NAME }}

      - name: Run bridge tests
        uses: ./.github/actions/bridge-tests
        with:
          enclave_name: ${{ env.ENCLAVE_NAME }}

      - name: Post kurtosis run
        if: always()
        uses: ./.github/actions/kurtosis-post-run
        with:
          enclave_name: ${{ env.ENCLAVE_NAME }}
          args_filename: deploy-to-external-l1

  # S15 (dev-ui-ci-snapshot plan): single-chain sequencer_type: anvil bring-up
  # (S3/S4/S4b/S5). Deliberately its OWN job rather than a row in list-ymls'
  # matrix, and deliberately NOT using the generic ./.github/actions/bridge-tests
  # action (K2 investigated this explicitly):
  #
  # Since K2, _get_bridge_service_url (src/additional_services/test_runner.star)
  # returns a real, reachable BRIDGE_SERVICE_URL for this stack too (the merged
  # aggkit-001 service's "rest" port) when test_runner is wired in -- so the
  # missing piece is no longer an empty URL. It's that bridge-tests' bats suite
  # (tests/agglayer/bridges.bats, shipped in test_runner_image) drives claims via
  # `polycli ulxly claim asset`, whose `--legacy` bridge-service client defaults
  # to true and requests the legacy zkevm-bridge-service's REST shape
  # (e.g. GET /bridges/{addr}). The aggkit bridge only serves /bridge/v1/...
  # routes, so that request 404s with a plain-text body ("404 page not found"),
  # and polycli's JSON decoder chokes on it ("invalid character 'p' after
  # top-level value"), failing the "bridge native ETH from L1 to L2" bats case.
  # (Verified empirically: K2-evidence/d-bats-run-l1-to-l2.log and
  # K2-evidence/d-legacy-endpoint-probe.txt in the snapshot-v2-aggkit-e2e plan.)
  # Until polycli/the bats suite gains a non-legacy (aggkit) bridge-service
  # mode, this job keeps its bespoke checks below instead of the generic action.
  # Verifies the two things S3/S4 identified as this stack's load-bearing
  # invariants: the sovereign bridge/GER bytecode landed at the deterministic
  # addresses, and aggkit's bridge REST reports both L1 and L2 sides synced+active.
  run-with-anvil-l2:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pre kurtosis run
        uses: ./.github/actions/kurtosis-pre-run
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_token: ${{ secrets.DOCKER_TOKEN }}

      - name: Kurtosis run
        run: kurtosis run --enclave=${{ env.ENCLAVE_NAME }} --args-file=./.github/tests/other/anvil/anvil-l2-rollup.yml .

      - name: Inspect enclave
        run: kurtosis enclave inspect ${{ env.ENCLAVE_NAME }}

      - name: Monitor rollup progress
        working-directory: .github/scripts
        run: ./monitor.sh ${{ env.ENCLAVE_NAME }} anvil ecdsa-multisig

      - name: Verify sovereign bridge/GER bytecode at the deterministic addresses
        run: |
          l2_rpc_url=$(kurtosis port print ${{ env.ENCLAVE_NAME }} l2-anvil-001 rpc)
          bridge_code=$(cast code 0xC8cbEBf950B9Df44d987c8619f092beA980fF038 --rpc-url "${l2_rpc_url}")
          ger_code=$(cast code 0xa40d5f56745a118d0906a34e69aec8c0db1cb8fa --rpc-url "${l2_rpc_url}")
          if [ "${bridge_code}" = "0x" ]; then
            echo "❌ sovereign bridge has no bytecode at 0xC8cbEBf950B9Df44d987c8619f092beA980fF038"
            exit 1
          fi
          if [ "${ger_code}" = "0x" ]; then
            echo "❌ sovereign GER manager has no bytecode at 0xa40d5f56745a118d0906a34e69aec8c0db1cb8fa"
            exit 1
          fi
          echo "✅ sovereign bridge (${#bridge_code} hex chars) and GER manager (${#ger_code} hex chars) bytecode present"

      - name: Verify aggkit bridge sync-status (L1 and L2 both synced+active)
        run: |
          bridge_rest_url=$(kurtosis port print ${{ env.ENCLAVE_NAME }} aggkit-001 rest)
          # The L1/L2 syncers race the "Monitor rollup progress" block-height wait above,
          # not the other way round -- poll instead of a single shot (matches monitor.sh's
          # own retry style).
          for attempt in $(seq 1 24); do
            # `run:` blocks execute under `bash -e`, and a bare
            # `var=$(cmd)` assignment is NOT a tested command -- so an
            # unguarded `curl -sf` here would abort the whole step on the
            # FIRST transient failure (exit 7 connection refused, 22 on
            # 4xx/5xx) and the retry loop could never do its job. The
            # early attempts are exactly when the endpoint is expected to
            # be unavailable, so every probe below tolerates failure and
            # falls through to the sleep.
            sync_status=$(curl -sf "${bridge_rest_url}/bridge/v1/sync-status?network_id=1" || true)
            echo "attempt ${attempt}/24 sync-status: ${sync_status}"
            l1_synced=$(jq -r '.l1_info.is_synced' <<<"${sync_status}" 2>/dev/null || true)
            l1_active=$(jq -r '.l1_info.is_active' <<<"${sync_status}" 2>/dev/null || true)
            l2_synced=$(jq -r '.l2_info.is_synced' <<<"${sync_status}" 2>/dev/null || true)
            l2_active=$(jq -r '.l2_info.is_active' <<<"${sync_status}" 2>/dev/null || true)
            if [ "${l1_synced}" = "true" ] && [ "${l1_active}" = "true" ] && [ "${l2_synced}" = "true" ] && [ "${l2_active}" = "true" ]; then
              echo "✅ aggkit bridge sync-status: L1 and L2 both synced+active"
              exit 0
            fi
            sleep 5
          done
          echo "❌ aggkit bridge sync-status did not reach fully synced+active on both sides within 120s"
          exit 1

      - name: Post kurtosis run
        if: always()
        uses: ./.github/actions/kurtosis-post-run
        with:
          enclave_name: ${{ env.ENCLAVE_NAME }}
          args_filename: anvil-l2-rollup
