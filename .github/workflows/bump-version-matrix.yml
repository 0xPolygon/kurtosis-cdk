# Opens (or refreshes) a PR bumping the pins the version matrix flags as behind
# stable, then asks Claude to review it. Called by the nightly when
# check-version-matrix reports drift; merging stays manual.

name: bump-version-matrix

on:
  workflow_call:
  workflow_dispatch:
  # TEMPORARY: test run from the PR, remove before merge.
  pull_request:
    paths: [.github/workflows/bump-version-matrix.yml]

permissions:
  contents: read
  id-token: write

concurrency:
  group: bump-version-matrix
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # TEMPORARY: the skill is not on main yet.
      - name: Load the skill from the PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth 1 origin "${{ github.sha }}"
          mkdir -p .claude/skills/update-version-matrix
          git show FETCH_HEAD:.claude/skills/update-version-matrix/SKILL.md > .claude/skills/update-version-matrix/SKILL.md

      - uses: actions/setup-python@v7
        with:
          python-version: 3.13

      - name: Install dependencies
        run: pip install -r scripts/version-matrix/requirements.txt

      - name: Install kurtosis
        run: |
          echo "deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt update
          sudo apt install -y kurtosis-cli=1.18.2
          kurtosis analytics disable

      - name: Bump pins
        id: claude
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_API_KEY }}
          # Read-only: the PR is opened below with another app's token.
          github_token: ${{ github.token }}
          prompt: |
            Read .claude/skills/update-version-matrix/SKILL.md and follow it in CI mode
            for ${{ github.repository }}: regenerate the matrix to find the drift and bump
            what is behind stable. Return the PR title and body, or an empty title if
            nothing was bumped.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(python3 scripts/version-matrix/*),Bash(docker manifest inspect:*),Bash(git diff:*),Bash(git status:*),Bash(kurtosis lint:*)"
            --json-schema '{"type":"object","properties":{"title":{"type":"string"},"body":{"type":"string"}},"required":["title","body"]}'

      # A GitHub App token, unlike GITHUB_TOKEN, lets the PR trigger CI.
      - name: Get app token
        id: app-token
        if: fromJSON(steps.claude.outputs.structured_output || '{"title":""}').title != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SEMANTIC_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the PR
        id: pr
        if: steps.app-token.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          base: main
          branch: chore/bump-version-matrix
          delete-branch: true
          add-paths: |
            .
            :!.github/workflows
            :!.claude
          commit-message: ${{ fromJSON(steps.claude.outputs.structured_output).title }}
          title: ${{ fromJSON(steps.claude.outputs.structured_output).title }}
          body: ${{ fromJSON(steps.claude.outputs.structured_output).body }}

      # claude.yml answers this bot's @claude comments with a review.
      - name: Ask Claude to review
        if: contains(fromJSON('["created","updated"]'), steps.pr.outputs.pull-request-operation)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "@claude please review"
