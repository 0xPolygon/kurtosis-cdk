# S2 (aggkit-proxy-l2l2 plan): first `kurtosis run` of a 2-L2 enclave.
# Deploys L1 + agglayer + rollup 1 (network_id 1, op-reth, aggkit-001 +
# aggkit-001-bridge) on the develop aggkit image. A second `kurtosis run`
# with params-aggkit-l2l2-run2.yml (SAME enclave) adds rollup 2.
#
# Modeled on params-aggkit-ui.yml (single-L2 baseline) and on aggkit's own
# multi-chain CI recipe (agglayer/aggkit .github/test_e2e_op_args_base.json +
# _chain_1.json, agglayer/e2e aggkit-e2e-multi-chains.yml).

deployment_stages:
  deploy_op_succinct: false
  # Legacy zkevm-bridge-service is not needed; aggkit-001-bridge (a second
  # aggkit instance with --components=bridge) is deployed unconditionally.
  deploy_cdk_bridge_infra: false

args:
  sequencer_type: op-reth
  # ecdsa-multisig (not pessimistic): the develop aggkit build routes every
  # certificate through an on-chain multisig validator committee. Pessimistic
  # contracts don't expose that interface, so aggsender's committee query
  # reverts and L2->L1 exits never settle to L1.
  consensus_contract_type: ecdsa-multisig
  # S2 (bridge-tracker plan): bumped to the upstream rc4 release image. The
  # L2->L2 autoclaim readiness bug found in S3 of the aggkit-proxy-l2l2 plan
  # (root-caused in agglayer/aggkit's claimer.go/rollup_preparer.go) is fixed
  # upstream in rc4 (https://github.com/agglayer/aggkit/pull/1761), so the
  # locally-built patched image is no longer needed.
  # S2 (bridge-tracker-rc5 plan): bumped to rc5 -- fail-fast validation on
  # [Tracker].L1GlobalExitRootAddress plus an unrelated bridgesync DB-index
  # perf fix (aggkit #1779/#1781/#1782/#1783, all folded into
  # https://github.com/agglayer/aggkit/pull/1784).
  # No kurtosis config change was required: this package already threads a
  # real, non-zero L1 GlobalExitRoot address into the tracker template.
  aggkit_image: ghcr.io/agglayer/aggkit:0.11.0-rc5
  # S3 (aggkit-proxy-l2l2 plan): "autoclaim" added so this instance's own
  # destination network (1) gets an AutoClaim claimer -- see
  # aggkit_autoclaim_destinations below.
  aggkit_components: "aggsender,aggoracle,autoclaim"

  # aggsender multisig committee: 1 validator, threshold 1.
  use_agg_sender_validator: true
  agg_sender_validator_total_number: 1
  agg_sender_multisig_threshold: 1

  # No bridge_ui yet (S5) and bridge_spammer off for determinism while
  # stabilizing the 2-chain topology.
  additional_services: []

  l2_chain_id: 20201

  # Rollup 2 is deployed by a SECOND `kurtosis run` (params-aggkit-l2l2-run2.yml)
  # into this same enclave with deploy_agglayer: false — it reuses the
  # agglayer deployed by THIS run. Since deploy_agglayer only runs once, this
  # run's agglayer/config.toml render is the only chance to register rollup 2
  # in [full-node-rpcs] / [proof-signers] (otherwise hardcoded to rollup 1
  # only). op_el_rpc_url is deterministic from deployment_suffix.
  #
  # sequencer_address is the DEFAULT l2_sequencer_address
  # (0x5b06837A43bdC3dD9F114558DAf4B26ed49842Ed) — run2 must NOT override
  # l2_sequencer_address (or any other l2_* role key: admin/sequencer/
  # aggregator/dac/aggoracle/sovereignadmin). Those roles are baked into L1
  # RollupManager permissions (deploy_parameters.json's admin/
  # timelockAdminAddress/deployerPvtKey = l2_admin_address/private_key,
  # granted admin role on the RollupManager during THIS run) and into
  # deterministic CREATE2 genesis addresses computed from them. Overriding
  # them per-run breaks rollup-2 creation ("Deployer does not have admin
  # role") and sovereign genesis generation ("AgglayerBridge proxy address
  # ... does not match expectedBridgeAddress") — confirmed by a failed
  # attempt during S2 bring-up. See agglayer_extra_rollups in
  # src/package_io/input_parser.star.
  agglayer_extra_rollups:
    - network_id: 2
      op_el_rpc_url: "http://op-el-1-op-reth-op-node-002:8545"
      sequencer_address: "0x5b06837A43bdC3dD9F114558DAf4B26ed49842Ed"

  # S3 (aggkit-proxy-l2l2 plan): autoclaim on destinations 1 & 2 only, NEVER
  # 0 (L1) -- L2->L1 deposits must stay manual-claim-only for the bridge UI.
  # This run's own l2_network_id is 1 (default), so this instance's claimer
  # targets network 1 (L1->L2-1 and L2-2->L2-1 deposits). BridgeServiceFinder
  # needs every participating network's bridge service URL listed statically
  # (no on-chain BRIDGE_SERVICE_URL metadata registration in this package).
  aggkit_autoclaim_destinations: [1]
  aggkit_autoclaim_bridge_urls:
    - network_id: 1
      bridge_url: "http://aggkit-001-bridge:5577"
    - network_id: 2
      bridge_url: "http://aggkit-002-bridge:5577"

optimism_package:
  chains:
    "001":
      proposer_params:
        enabled: false
      network_params:
        network_id: "20201"
