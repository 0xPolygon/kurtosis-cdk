# First `kurtosis run` of a two-L2 anvil enclave: anvil L1, agglayer and rollup 1
# (network_id 1, anvil L2, aggkit-001). A second run with
# params-aggkit-anvil-l2l2-run2.yml, in the same enclave, adds rollup 2 and the
# aggkit-proxy, bridge_ui and dev-ui services.
#
# Same as params-aggkit-l2l2-run1.yml without the optimism_package block, which
# sequencer_type anvil rejects, and with l1_engine anvil.

deployment_stages:
  deploy_op_succinct: false
  # The legacy zkevm-bridge-service is not needed: aggkit-001 serves the bridge
  # REST API itself ("bridge" in aggkit_components below).
  deploy_cdk_bridge_infra: false
  # Nothing in the anvil path reads the postgres databases.
  deploy_databases: false

args:
  # Anvil on both layers, L1 and L2.
  l1_engine: anvil
  # The L1 URLs are derived from deployment_suffix (anvil-001).
  sequencer_type: anvil
  consensus_contract_type: ecdsa-multisig

  # "bridge" makes aggkit-001 also serve the bridge REST API (port 5577).
  aggkit_components: "aggsender,aggoracle,bridge"

  # aggsender multisig committee: 1 validator, threshold 1.
  use_agg_sender_validator: true
  agg_sender_validator_total_number: 1
  agg_sender_multisig_threshold: 1

  additional_services: []

  l2_chain_id: 20201
  l2_network_id: 1

  # Rollup 2 is deployed by the second run, which reuses the agglayer deployed
  # here, so it is registered in [full-node-rpcs] and [proof-signers] by this run.
  # The URL is not rewritten like this run's own op_el_rpc_url, so the anvil L2-002
  # service name is spelled out.
  #
  # sequencer_address is the default l2_sequencer_address. The second run must not
  # override it or any other l2_* role key; see params-aggkit-l2l2-run2.yml.
  agglayer_extra_rollups:
    - network_id: 2
      op_el_rpc_url: "http://l2-anvil-002:8545"
      sequencer_address: "0x5b06837A43bdC3dD9F114558DAf4B26ed49842Ed"

# No optimism_package block: sequencer_type anvil rejects it.
